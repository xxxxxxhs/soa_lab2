plugins {
    id 'war'
}

dependencies {
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
    compileOnly 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'

    testImplementation 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
    testImplementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    testImplementation 'org.glassfish.jaxb:jaxb-runtime:4.0.8'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

war {
    archiveFileName = 'vehicles.war'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Europe/Moscow'
}
